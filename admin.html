<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TEMO WEIGHT — Admin</title>
<link rel="manifest" href="/weight/admin-manifest.json">
<meta name="theme-color" content="#e00016">
<link rel="icon" href="/weight/admin-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/weight/admin-icon.svg">
<style>
:root{--blue:#08a8ff;--red:#ef4d5a;--green:#19b66b;--text:#102033;--line:#cfe2ee}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5fbff;color:var(--text)}
.wrap{max-width:900px;margin:auto;padding:18px}
.card{background:#fff;border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 5px 25px #0b8ed21a}
h1{margin:0;color:#078ed8;font-size:25px}
input,button{font:inherit}
input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;margin:7px 0}
button{border:0;border-radius:12px;padding:12px 15px;cursor:pointer;font-weight:800}
.primary{background:var(--blue);color:#fff}
.muted{background:#eef4f7;color:#34495e}
.msg{min-height:24px;margin-top:10px;color:var(--red);line-height:1.45}
.hidden{display:none!important}
#loginBox{max-width:500px;margin:12vh auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.toolbar input{margin:0;flex:1}
.count{font-size:20px;font-weight:900;margin:4px 0 16px}
.user{padding:15px 4px;border-bottom:1px solid #e7eef3}
.email{font-weight:800;color:#087dbb;word-break:break-all}
.meta{font-size:12px;color:#71808d;margin-top:5px}
.status{margin-top:14px}
@media(max-width:600px){.wrap{padding:14px}.card{padding:17px}.head{align-items:flex-start}.toolbar{align-items:stretch}.toolbar button{flex:none}}
</style>
</head>
<body>
<div class="wrap">
<section id="loginBox" class="card">
<h1>TEMO WEIGHT — Admin</h1>
<p>ადმინისტრატორის შესვლა</p>
<input id="email" type="email" autocomplete="username" placeholder="Email">
<input id="password" type="password" autocomplete="current-password" placeholder="პაროლი">
<button id="login" class="primary" style="width:100%">შესვლა</button>
<div id="loginMsg" class="msg"></div>
</section>

<main id="adminBox" class="hidden">
<div class="head">
<div>
<h1>მომხმარებლები</h1>
<div id="adminEmail" class="meta"></div>
</div>
<button id="logout" class="muted">🚪 გასვლა</button>
</div>

<section class="card">
<div class="toolbar">
<input id="search" placeholder="მოძებნე email...">
<button id="refresh" class="primary">🔄 განახლება</button>
</div>
<div class="count">სულ მომხმარებელი: <span id="total">0</span></div>
<div id="users"></div>
<div id="status" class="meta status"></div>
</section>
</main>
</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCOsRuJE3i5G1GWe99tPZSj5zOURwa4Kms",authDomain:"temo-50.firebaseapp.com",databaseURL:"https://temo-50-default-rtdb.europe-west1.firebasedatabase.app",projectId:"temo-50",storageBucket:"temo-50.firebasestorage.app",messagingSenderId:"147888227478",appId:"1:147888227478:web:0f7f0808d508d113116eb7"};
const ADMIN_EMAIL="temo75elia@gmail.com";
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
const functions=firebase.app().functions("europe-west1");
const bootstrapAdmin=functions.httpsCallable("bootstrapAdmin");
const adminListUsers=functions.httpsCallable("adminListUsers");
const adminSetDisabled=functions.httpsCallable("adminSetDisabled");
const adminDeleteUser=functions.httpsCallable("adminDeleteUser");
const $=id=>document.getElementById(id);
let users=[];

function setMsg(text,ok=false){
  $("loginMsg").textContent=text||"";
  $("loginMsg").style.color=ok?"#19b66b":"#ef4d5a";
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
let adminUid="";
let busy=false;
function errorText(e){
  console.error("TEMO WEIGHT Admin error",e);
  const code=String(e&&e.code||"");
  if(code.includes("functions/not-found")||code.includes("functions/unavailable")) return "Firebase Admin ფუნქციები ჯერ არ არის განთავსებული.";
  if(code.includes("permission-denied")) return "წვდომა უარყოფილია: შეამოწმე ადმინისტრატორის უფლებები.";
  if(code.includes("unauthenticated")) return "სესია დასრულდა. თავიდან შედი.";
  return (e&&e.message)||"შეცდომა მოხდა.";
}
function render(){
  const q=$("search").value.trim().toLowerCase();
  const list=users.filter(u=>String(u.email||"").toLowerCase().includes(q));
  $("total").textContent=users.length;
  $("users").innerHTML=list.map(u=>{
    const self=u.uid===adminUid, disabled=!!u.disabled;
    return '<div class="user" style="'+(disabled?'opacity:.7':'')+'"><div class="email">'+esc(u.email||"(email არ არის)")+'</div>'+
      '<div class="meta">'+(disabled?'⛔ დაბლოკილია':'✅ აქტიურია')+' · '+(u.emailVerified?'ელფოსტა დადასტურებულია':'ელფოსტა დაუდასტურებელია')+'</div>'+
      '<div class="actions" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'+
      '<button class="muted" data-action="toggle" data-uid="'+esc(u.uid)+'" '+(self?'disabled':'')+'>'+(disabled?'განბლოკვა':'დაბლოკვა')+'</button>'+
      '<button style="background:#ef4d5a;color:white" data-action="delete" data-uid="'+esc(u.uid)+'" '+(self?'disabled':'')+'>წაშლა</button></div></div>';
  }).join("") || '<div class="meta">მომხმარებელი ვერ მოიძებნა.</div>';
}
async function loadUsers(){
  $("status").textContent="მომხმარებლები იტვირთება...";
  $("refresh").disabled=true;
  try{
    try{
      const res=await adminListUsers();
      users=Array.isArray(res.data.users)?res.data.users:[];
      $("status").textContent="მზადაა · Firebase Authentication · სულ: "+(res.data.total??users.length);
    }catch(functionError){
      console.warn("Admin list function unavailable; using Firestore profile list",functionError);
      const snap=await db.collection("users").get();
      users=snap.docs.map(d=>({uid:d.id,...(d.data()||{}),disabled:false,emailVerified:false}));
      users=users.filter(u=>u.email);
      $("status").textContent="მომხმარებლების სია ჩაიტვირთა Firestore-იდან. დაბლოკვა/წაშლის მოქმედებისთვის სერვერული ფუნქციები უნდა მუშაობდეს.";
    }
    users.sort((a,b)=>String(a.email||"").localeCompare(String(b.email||"")));
    render();
  }catch(e){
    $("status").textContent="მომხმარებლები ვერ ჩაიტვირთა: "+errorText(e);
  }finally{$("refresh").disabled=false;}
}
async function userAction(action,uid){
  if(busy)return;
  const u=users.find(x=>x.uid===uid); if(!u)return;
  if(uid===adminUid)return;
  if(action==="delete"&&!confirm("ნამდვილად წაშალო "+(u.email||"ეს მომხმარებელი")+"?"))return;
  if(action==="toggle"&&!confirm((u.disabled?"განბლოკო ":"დაბლოკო ")+(u.email||"ეს მომხმარებელი")+"?"))return;
  busy=true; $("status").textContent="მოქმედება სრულდება...";
  $("users").querySelectorAll("button").forEach(b=>b.disabled=true);
  try{
    if(action==="delete") await adminDeleteUser({uid});
    else await adminSetDisabled({uid,disabled:!u.disabled});
    await loadUsers();
    $("status").textContent=action==="delete"?"მომხმარებელი წაიშალა.":"სტატუსი განახლდა.";
  }catch(e){$("status").textContent="ვერ შესრულდა: "+errorText(e);}
  finally{busy=false;render();}
}

$("login").onclick=async()=>{
  setMsg("");
  const email=$("email").value.trim(),password=$("password").value;
  if(!email||!password){setMsg("შეიყვანე email და პაროლი.");return}
  if(email.toLowerCase()!==ADMIN_EMAIL){setMsg("შესვლა დაშვებულია მხოლოდ ადმინისტრატორის ანგარიშისთვის.");return}
  $("login").disabled=true;
  try{
    await auth.signInWithEmailAndPassword(email,password);
  }catch(e){
    console.error("Admin login error",e);
    setMsg("შესვლა ვერ მოხერხდა. შეამოწმე email და პაროლი.");
  }finally{$("login").disabled=false;}
};
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")$("login").click()});
$("search").oninput=render;
$("refresh").onclick=loadUsers;
$("logout").onclick=()=>auth.signOut();

$("users").addEventListener("click",e=>{
  const b=e.target.closest("button[data-action]");
  if(b)userAction(b.dataset.action,b.dataset.uid);
});
auth.onAuthStateChanged(async user=>{
  $("adminBox").classList.add("hidden");
  if(!user){
    adminUid=""; users=[];
    $("loginBox").classList.remove("hidden");
    $("users").innerHTML=""; $("total").textContent="0";
    return;
  }
  if(String(user.email||"").toLowerCase()!==ADMIN_EMAIL){
    setMsg("ამ ანგარიშს Admin-ზე წვდომა არ აქვს.");
    await auth.signOut(); return;
  }
  adminUid=user.uid;
  $("loginBox").classList.add("hidden");
  $("adminEmail").textContent=user.email||"";
  $("adminBox").classList.remove("hidden");
  $("status").textContent="ადმინისტრატორის უფლებები მოწმდება...";
  try{
    await bootstrapAdmin();
    await user.getIdToken(true);
  }catch(e){
    console.warn("Admin bootstrap failed; trying Firestore user list",e);
  }
  await loadUsers();
});
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/weight/admin-sw.js",{scope:"/weight/"}).catch(()=>{});}</script>
</body>
</html>
